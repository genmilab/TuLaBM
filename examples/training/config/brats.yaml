wandb_project: TuLaBM-BraTS2023-GLI

timestep_sampling: custom_timesteps
selected_timesteps: [250, 500, 750, 1000]
prob: [0.25, 0.25, 0.25, 0.25]
pixel_loss_type: l1
pixel_loss_weight: 18.0
latent_loss_type: l2
latent_loss_weight: 1.0
boundary_loss_weight: 14.0
boundary_tau: 0.25
attention_bias_weight: 0.5
bridge_noise_sigma: 0.008

train_shards:
  - pipe:cat path/to/BraTS2023_GLI_imgs/train/train_shard_*.tar

validation_shards:
  - pipe:cat path/to/BraTS2023_GLI_imgs/validation/validation_shard_*.tar

unet_input_channels: 4
vae_num_channels: 4
batch_size: 8
learning_rate: 4e-5
optimizer: AdamW
num_steps: [1, 4]
log_interval: 500
resume_from_checkpoint: false
max_epochs: 1
max_steps: 50000
save_interval: 10000
save_ckpt_path: /path/to/BraTS2023_GLI_ckpts

conditioning_images_keys: []
conditioning_masks_keys: []
