[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "tulabm"
dynamic = ["dependencies", "optional-dependencies"]
description = "TuLaBM: Tumor-Biased Latent Bridge Matching for Contrast-Enhanced MRI Synthesis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Atharva Atul Rege" },
    { name = "Adinath Madhavrao Dukre" },
    { name = "Numan Balci" },
    { name = "Dwarikanath Mahapatra" },
    { name = "Imran Razzak" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
version = "0.1"

[project.urls]
Homepage = "https://github.com/genmilab/TuLaBM"
Repository = "https://github.com/genmilab/TuLaBM"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/lbm"]
